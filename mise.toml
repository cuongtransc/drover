# Drover — Tauri 2 (pnpm + cargo). `mise tasks` lists them, `mise run <task>` runs one.
min_version = "2026.9.0"

[settings]
experimental = true # [deps] is experimental

# Same majors as .github/workflows/release.yml.
[tools]
node = "24"
pnpm = "11"
# stable, as CI's dtolnay/rust-toolchain@stable. Without a pin the cargo shim fails with
# "No version is set for shim" in a shell that lacks ~/.cargo/bin on PATH.
rust = "stable"

[env]
APP = "src-tauri/target/release/bundle/macos/Drover.app"
LOCAL_APP = "src-tauri/target/local/bundle/macos/Drover.app"

# Frontend dependencies install before any `mise run` when the lockfile changed.
# By hand: `mise deps`.
[deps.pnpm]
auto = true

# The global dispatcher (~/.config/git/hooks/ct-hook-dispatch) already runs
# .githooks; a local core.hooksPath would bypass it, so set one only without it.
[tasks.setup]
description = "One-time setup after cloning: wire the pre-commit gate"
run = """
hooks_dir=$(git config --global --get core.hooksPath) || hooks_dir=
case "$hooks_dir" in
  "~") hooks_dir=$HOME ;;
  "~/"*) hooks_dir="$HOME/${hooks_dir#"~/"}" ;;
esac
if [ -n "$hooks_dir" ] && [ -x "$hooks_dir/ct-hook-dispatch" ]; then
  [ "$(git config --local --get core.hooksPath)" = ".githooks" ] && git config --local --unset core.hooksPath
  echo 'git hooks: global dispatcher runs .githooks'
else
  git config core.hooksPath .githooks
  echo 'git hooks: core.hooksPath=.githooks'
fi
echo 'next: mise run dev'
"""

# Its own identifier (tauri.dev.conf.json): a separate data dir and ssh control sockets, so it
# runs beside the installed Drover.app without sharing machines or ending its ssh masters.
[tasks.dev]
description = "Run the app with hot reload, apart from the installed app"
run = "pnpm tauri dev --config src-tauri/tauri.dev.conf.json"

[tasks.build]
description = "Build the release bundle (Drover.app)"
run = "pnpm tauri build --bundles app"

# The release build minus LTO (src-tauri/Cargo.toml [profile.local]): same behaviour, about 3x
# faster to rebuild. For the bundle a release ships, use `build`.
[tasks."build:local"]
description = "Build the bundle without LTO (Drover.app under target/local)"
run = "pnpm tauri build --bundles app -- --profile local"

[tasks.start]
description = "Build the release bundle and open it"
depends = ["build"]
run = "open $APP"

# Replaces any previous copy so files removed from the bundle don't linger, then signs it with
# the `sign:setup` identity so macOS keeps its permission grants across installs.
[tasks."app:install"]
description = "Build without LTO (profile.local) and install it into /Applications"
depends = ["build:local"]
run = ['[ -d "$HOME/Library/Application Support/dev.cuongtransc.drover" ] || scripts/migrate-id.sh', "rm -rf /Applications/Drover.app", "ditto $LOCAL_APP /Applications/Drover.app", "scripts/sign-app.sh /Applications/Drover.app"]

[tasks."app:install:release"]
description = "Build the release bundle, as shipped, and install it into /Applications"
depends = ["build"]
run = ['[ -d "$HOME/Library/Application Support/dev.cuongtransc.drover" ] || scripts/migrate-id.sh', "rm -rf /Applications/Drover.app", "ditto $APP /Applications/Drover.app", "scripts/sign-app.sh /Applications/Drover.app"]

# Ad-hoc signed builds get a new identity each time, so macOS asks again for every permission.
# Before the first Drover install: Drover's identifier starts with empty folders. app:install
# runs it while Drover has no state yet, so a reinstall never does.
[tasks."app:migrate-id"]
description = "One-time: copy the old Herdr state (dev.cuongnb.herdrapp) to Drover's folders"
run = "scripts/migrate-id.sh"

[tasks."sign:setup"]
description = "One-time: create the local signing identity app:install signs Drover.app with"
run = "scripts/sign-setup.sh"

# Call it `mise run fmt`: bare `mise fmt` is mise's own mise.toml formatter.
[tasks.fmt]
description = "Format the backend in place"
dir = "src-tauri"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Fail when the backend is not formatted"
dir = "src-tauri"
run = "cargo fmt --check"

[tasks.typecheck]
description = "Type-check the frontend"
run = "pnpm typecheck"

[tasks.lint]
description = "Lint the backend; any warning fails"
dir = "src-tauri"
run = "cargo clippy -- -D warnings"

[tasks."test:frontend"]
description = "Frontend unit tests"
run = "pnpm test"

# Real mouse and key events in the installed Chrome (headless); not part of `ci`.
[tasks."test:browser"]
description = "Frontend tests that need a real browser (*.browser.test.tsx)"
run = "pnpm vitest run --config vitest.browser.config.ts"

[tasks."docs:ui-map"]
description = "Redraw docs/design/ui-map.html and the README screenshots from the real App (after a UI change)"
run = [
  "pnpm vitest run --config vitest.uimap.config.ts",
  "node scripts/ui-map.mjs",
]

# A backtrace in every failure: attach::reopen_after_unacked_backlog_still_delivers failed twice on
# the first gate in a fresh worktree (2026-10-06, 2026-10-12), panicking inside its wait_for helper,
# and without the trace the timed-out call was unknown. Two cold re-runs passed.
[tasks."test:backend"]
description = "Backend unit tests"
dir = "src-tauri"
env = { RUST_BACKTRACE = "1" }
run = "cargo test"

# A throwaway keychain and a tiny bundle; never the login keychain or /Applications.
[tasks."test:sign"]
description = "Tests for the local signing scripts (macOS)"
run = "scripts/sign.test.sh"

# A throwaway HOME; never the real ~/Library.
[tasks."test:migrate"]
description = "Tests for the state migration script"
run = "sh scripts/migrate-id.test.sh"

[tasks.test]
description = "Frontend, backend and signing script tests"
depends = ["test:frontend", "test:backend", "test:sign", "test:migrate"]

# Starts isolated `drover-test-*` sessions on the local herdr and always
# stops and deletes them. The SSH test only runs when DROVER_SSH_TEST is set.
[tasks."test:integration"]
description = "Integration tests against a real local herdr"
dir = "src-tauri"
run = "cargo test -- --ignored --test-threads=1"

# Read-only, runs on pre-commit (.githooks/pre-commit).
# Warns, never fails: words the glossaries list under _Avoid_ in living docs and UI strings
# (specs/plans under docs/superpowers and the ADRs are history and left out).
[tasks."lint:terms"]
description = "Warn where docs or UI strings use a word CONTEXT.md avoids (Agent Dashboard, Project row, session orchestrator, Herdr)"
run = """
hits=$(git ls-files '*.md' '*.tsx' | grep -v -e '^docs/superpowers/' -e '^docs/adr/' -e '^CONTEXT.md$' | grep -v -F '.test.' \\
  | xargs grep -n -E 'Agent Dashboard|Project row|[Ss]ession orchestrator|"Directory"|/path/to/project|\\bHerdr\\b' | grep -v 'named Herdr' || true)
if [ -n "$hits" ]; then echo "lint:terms (warning) — see CONTEXT.md:"; echo "$hits"; else echo "lint:terms: clean"; fi
"""

[tasks.ci]
description = "The gate: format, typecheck, lint and test must pass; term check warns"
depends = ["fmt:check", "typecheck", "lint", "test", "lint:terms"]
run = "echo 'ci passed'"

# Regenerates src-tauri/icons from one square source image. Only needed when the
# icon itself changes; the committed icons are what `build` packages.
[tasks."gen:icons"]
description = "Regenerate app icons from a source image"
usage = 'arg "[source]" default="src-tauri/icons/icon.png" help="Square PNG or SVG, 1024px+"'
run = 'pnpm tauri icon "${usage_source}"'

[tasks.clean]
description = "Remove frontend and cargo build output"
run = ["rm -rf dist", "cargo clean --manifest-path src-tauri/Cargo.toml"]
